<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Commander Life</title>
<style>
  :root { --gap: 5px; --radius: 16px; --ink: #141414; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    position: fixed; inset: 0;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }

  #board {
    position: absolute;
    top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
    left: env(safe-area-inset-left); right: env(safe-area-inset-right);
  }

  /* ---------- player panels ---------- */
  .panel {
    position: absolute; border-radius: var(--radius); overflow: hidden; transition: filter .25s;
    background-size: cover; background-position: center; color: var(--ink);
  }
  .panel.dark { --ink: #f2f2f2; }
  .panel.multi .num, .panel.multi .label, .panel.multi .glyph, .panel.multi .name {
    text-shadow: 0 0 calc(var(--big) * .06) var(--halo), 0 0 2px var(--halo);
  }
  /* blends always mix light and dark areas, so use white text with a dark halo */
  .panel.multi { --ink: #fff; --halo: rgba(0,0,0,.85); }
  .panel.multi .poison:not(.active) { background: rgba(0,0,0,.45); }
  .panel.alt .num, .panel.alt .label { text-shadow: none; }
  .panel.dead { filter: saturate(.25) brightness(.7); }
  .panel.pick { animation: pick .18s ease-out; }
  .panel.chosen { box-shadow: inset 0 0 0 6px #fff; }
  @keyframes pick { from { filter: brightness(1.6); } to { filter: none; } }

  .inner { position: absolute; left: 50%; top: 50%; }
  .shade { position: absolute; inset: 0; background: rgba(0,0,0,.72); opacity: 0; transition: opacity .15s; pointer-events: none; }
  .panel.alt .shade { opacity: 1; }

  .zone { position: absolute; top: 0; bottom: 0; width: 50%; touch-action: none; }
  .zone.minus { left: 0; } .zone.plus { right: 0; }
  .zone.pressed { background: rgba(0,0,0,.08); }
  .panel.dark .zone.pressed { background: rgba(255,255,255,.08); }
  .panel.alt .zone.pressed { background: rgba(255,255,255,.08); }

  .glyph {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: calc(var(--big) * .34); font-weight: 300; opacity: .35; pointer-events: none;
  }
  .glyph.minus { left: 9%; } .glyph.plus { right: 9%; }
  .panel.alt .glyph { color: #fff; }

  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
  }
  .label { font-size: calc(var(--big) * .16); font-weight: 700; min-height: 1.25em; white-space: nowrap; }
  .num {
    font-size: var(--big); font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  }
  .sub { font-size: calc(var(--big) * .15); font-weight: 600; min-height: 1.25em; color: rgba(255,255,255,.75); }

  .delta {
    position: absolute; left: 50%; top: 50%;
    transform: translate(calc(var(--big) * .95), calc(var(--big) * -.55));
    font-size: calc(var(--big) * .2); font-weight: 700; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .delta.show { opacity: .8; }
  .panel.alt .delta { color: #fff; }

  .foot {
    position: absolute; left: 14px; right: 14px; bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .who { display: flex; align-items: center; gap: 7px; max-width: 65%; min-width: 0; }
  .name { font-weight: 700; font-size: 14px; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pips { display: flex; gap: 3px; flex: none; }
  .pip {
    width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.35);
  }
  .pip svg { width: 13px; height: 13px; }
  .panel.alt .name { color: #fff; }
  .poison {
    pointer-events: auto; border: 0; border-radius: 99px; padding: 5px 11px;
    background: rgba(0,0,0,.16); font-weight: 700; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .panel.dark .poison { background: rgba(255,255,255,.16); }
  .poison.active, .panel.dark .poison.active { background: #000; color: #7fe07f; }
  .poison.hidden { display: none; }

  /* ---------- commander damage badges ---------- */
  #badges { position: absolute; inset: 0; pointer-events: none; }
  .badge {
    position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border-radius: 50%; border: 2px solid transparent;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums;
    pointer-events: auto; padding: 0;
  }
  .badge::before { content: ""; position: absolute; inset: -9px; }
  .badge.active { background: #000; border-color: currentColor; }
  .badge.lethal { background: #b00000; color: #fff !important; }
  .badge.hidden { display: none; }

  #menuBtn {
    position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; border: 3px solid #000; background: #1c1c1e; color: #fff;
    font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  }

  /* ---------- settings sheet ---------- */
  /* ---------- win screen ---------- */
  #win {
    position: fixed; inset: 0; z-index: 20; display: none; overflow: hidden;
    align-items: center; justify-content: center; background-size: cover; background-position: center;
  }
  #win.open { display: flex; animation: winIn .5s ease-out; }
  #win::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.25), rgba(0,0,0,.78) 75%);
  }
  @keyframes winIn { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    position: relative; width: min(78vmin, 420px); text-align: center; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  #win.open .win-card { animation: winPop .7s cubic-bezier(.2, 1.4, .4, 1) both .1s; }
  @keyframes winPop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
  .win-crown { font-size: 54px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 -8px; } }
  .win-pips { display: flex; gap: 8px; justify-content: center; margin: 10px 0 6px; }
  .win-pips .pip { width: 34px; height: 34px; box-shadow: 0 0 0 2px rgba(255,255,255,.7), 0 3px 10px rgba(0,0,0,.5); }
  .win-pips .pip svg { width: 23px; height: 23px; }
  .win-name {
    font-size: clamp(30px, 11vmin, 64px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
    overflow-wrap: anywhere;
  }
  .win-sub { font-size: clamp(18px, 6vmin, 30px); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: .9; }
  .win-stats { margin-top: 10px; font-size: 15px; font-weight: 600; opacity: .85; }
  .win-actions { display: flex; gap: 10px; margin-top: 22px; }
  .win-actions button {
    flex: 1; border: 0; border-radius: 14px; padding: 14px 10px; font-weight: 800; font-size: 16px; text-shadow: none;
    background: rgba(255,255,255,.18); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .win-actions .primary { background: #fff; color: #111; }
  .float {
    position: absolute; bottom: -60px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; opacity: 0;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.5); animation: rise linear infinite;
  }
  .float svg { width: 70%; height: 70%; }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    10% { opacity: .9; }
    90% { opacity: .9; }
    100% { transform: translateY(calc(-100vh - 120px)) rotate(var(--spin)); opacity: 0; }
  }

  #sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: flex-end; justify-content: center; z-index: 10;
  }
  #sheet.open { display: flex; }
  .card {
    width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto;
    background: #1c1c1e; color: #f2f2f7; border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    -webkit-user-select: auto; user-select: auto;
  }
  .card h2 { margin: 0 0 12px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
  .card h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8e8e93; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: flex; background: #2c2c2e; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; }
  .seg button.on { background: #636366; }
  input[type=number], input[type=text] {
    background: #2c2c2e; border: 0; border-radius: 10px; color: #fff;
    padding: 9px 12px; font-size: 16px; width: 90px;
  }
  input[type=text] { width: 100%; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; gap: 10px; }
  .toggle input[type=checkbox] { width: 22px; height: 22px; }
  .pl { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 12px; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatches { align-items: center; }
  .sw {
    width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); position: relative;
  }
  .sw.on { border-color: #fff; }
  .sw.sym { width: 36px; height: 36px; border: 0; display: flex; align-items: center; justify-content: center; }
  .sw.sym svg { width: 23px; height: 23px; }
  .sw.sym.on { box-shadow: 0 0 0 2px #1c1c1e, 0 0 0 4.5px #fff; }
  .sw.sym:not(.on) { opacity: .8; }
  .sw.on:not(.sym)::after {
    content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #000;
  }
  .sw.on.darksw::after { color: #fff; }
  .preview {
    height: 34px; border-radius: 10px; background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: flex-end; padding: 0 4px;
  }
  .reroll {
    border: 0; border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 700;
    background: rgba(0,0,0,.55); color: #fff;
  }
  .reroll.hidden { display: none; }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .actions button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font-weight: 700; background: #2c2c2e; }
  .actions .danger { background: #ff453a; color: #fff; }
  .hint { font-size: 13px; color: #8e8e93; margin-top: 6px; }
  .x { border: 0; background: #2c2c2e; border-radius: 50%; width: 32px; height: 32px; padding: 0; }
</style>
</head>
<body>
<div id="board">
  <div id="badges"></div>
  <button id="menuBtn" aria-label="Settings">⚙︎</button>
</div>

<div id="win" role="dialog" aria-label="Winner">
  <div id="winFloats"></div>
  <div class="win-card">
    <div class="win-crown">👑</div>
    <div class="win-pips" id="winPips"></div>
    <div class="win-name" id="winName"></div>
    <div class="win-sub">wins!</div>
    <div class="win-stats" id="winStats"></div>
    <div class="win-actions">
      <button id="winBack">Keep playing</button>
      <button id="winNew" class="primary">New game</button>
    </div>
  </div>
</div>

<div id="sheet">
  <div class="card">
    <h2>Settings <button class="x" id="closeBtn" aria-label="Close">✕</button></h2>

    <h3>Players</h3>
    <div class="seg" id="countSeg">
      <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
    </div>

    <h3>Starting life</h3>
    <div class="row">
      <div class="seg" id="lifeSeg">
        <button data-l="20">20</button><button data-l="30">30</button><button data-l="40">40</button>
      </div>
      <input type="number" id="lifeInput" inputmode="numeric" min="1" max="999">
    </div>
    <div class="hint" id="lifeHint"></div>

    <h3>Counters</h3>
    <label class="toggle"><span>Commander damage</span><input type="checkbox" id="cmdOn"></label>
    <label class="toggle"><span>Commander damage lethal at</span><input type="number" id="cmdLimit" inputmode="numeric" min="1" max="99"></label>
    <label class="toggle"><span>Poison counters</span><input type="checkbox" id="poisonOn"></label>
    <label class="toggle"><span>Poison lethal at</span><input type="number" id="poisonLimit" inputmode="numeric" min="1" max="99"></label>

    <h3>Names &amp; colors</h3>
    <div id="playerEdit"></div>

    <div class="actions">
      <button id="firstBtn">🎲 Who goes first</button>
      <button id="resetBtn" class="danger">Reset game</button>
    </div>
  </div>
</div>

<script>
(() => {
  // The five Magic colors (W U B R G) first, then a few extras.
  // WUBRG use the mana colors from the cards.
  const WHITE = '#f8e7b9', BLUE = '#0e68ab', BLACK = '#150b00', RED = '#d3202a', GREEN = '#00733e';
  const COLORS = [WHITE, BLUE, BLACK, RED, GREEN, '#bba2ff', '#ffb05c', '#ff9ad5', '#d2d2d2'];
  const DEFAULT_COLORS = [WHITE, RED, GREEN, BLUE];
  // Brighter versions of the dark mana colors, for text and badges on dark backgrounds.
  const BRIGHT = { [BLUE]: '#4da6ea', [BLACK]: '#a89f96', [RED]: '#ff5a5f', [GREEN]: '#3fc27a' };
  // Older versions of the app used these; map them onto the new ones.
  const OLD = { '#fdeba6': WHITE, '#2bcdfd': BLUE, '#26262a': BLACK, '#ff5c5c': RED, '#9dd443': GREEN };

  const lum = hex => {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
    return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
  };
  const isDarkSet = cols => cols.reduce((a, c) => a + lum(c), 0) / cols.length < .25;
  const newSeed = () => (Math.random() * 2 ** 31) | 0;
  function rng(seed) { // mulberry32
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- color symbols (simple sun / drop / skull / flame / tree glyphs) ----------
  const sunPath = (() => {
    let d = 'M12 7.6a4.4 4.4 0 1 1 0 8.8a4.4 4.4 0 1 1 0-8.8z';
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, w = .32;
      const pt = (rad, ang) => (12 + rad * Math.cos(ang)).toFixed(2) + ' ' + (12 + rad * Math.sin(ang)).toFixed(2);
      d += `M${pt(6, a - w)}L${pt(11, a)}L${pt(6, a + w)}z`;
    }
    return d;
  })();
  const GLYPHS = {
    [WHITE]: (fg) => `<path fill="${fg}" d="${sunPath}"/>`,
    [BLUE]: (fg) => `<path fill="${fg}" d="M12 2.2C12 2.2 5 10.4 5 15a7 7 0 0 0 14 0c0-4.6-7-12.8-7-12.8z"/>`,
    [BLACK]: (fg, bg) => `<path fill="${fg}" d="M12 2.5c-4.7 0-8.3 3.3-8.3 7.9 0 2.6 1.1 4.5 2.8 5.7v3.4c0 .8.6 1.4 1.4 1.4h8.2c.8 0 1.4-.6 1.4-1.4v-3.4c1.7-1.2 2.8-3.1 2.8-5.7 0-4.6-3.6-7.9-8.3-7.9z"/>` +
      `<circle cx="8.7" cy="11.2" r="2.1" fill="${bg}"/><circle cx="15.3" cy="11.2" r="2.1" fill="${bg}"/>` +
      `<path fill="${bg}" d="M12 13.6l1.3 2.4h-2.6z"/><path stroke="${bg}" stroke-width="1" d="M10 18v2.4M12 18v2.4M14 18v2.4"/>`,
    [RED]: (fg) => `<path fill="${fg}" d="M12.4 1.8c.6 3.6 5.6 6.6 5.6 12.2a6 6 0 0 1-12 0c0-2.9 1.4-4.9 3-6.5.1 2 .9 3.4 2.2 3.9-.4-3.3.1-6.6 1.2-9.6z"/>`,
    [GREEN]: (fg) => `<path fill="${fg}" d="M12 2a5 5 0 0 0-4.7 3.4A4.6 4.6 0 0 0 4.6 13.6 4.4 4.4 0 0 0 9 18h2v4h2v-4h2a4.4 4.4 0 0 0 4.4-4.4 4.6 4.6 0 0 0-2.7-8.2A5 5 0 0 0 12 2z"/>`,
  };
  // An icon for one color: the glyph in a contrasting ink, or nothing for the extra colors.
  function glyph(c) {
    const g = GLYPHS[c];
    if (!g) return '';
    const fg = c === WHITE ? '#150b00' : '#f8f1dc';
    return `<svg viewBox="0 0 24 24" aria-hidden="true">${g(fg, c)}</svg>`;
  }

  // ---------- swirl backgrounds ----------
  // A single color is a flat fill. Several colors get a randomly chosen style,
  // painted pixel by pixel on a canvas and bent by layered noise:
  //   marble (flowing ribbons), silk (wide soft folds), split (one wavy region
  //   per color), aurora (soft drifting curtains), mesh (smooth gradient),
  //   lava (rounded blobs) and clouds (hazy mix).
  // Painted once per color set + seed, then cached.
  const STYLES = ['marble', 'silk', 'split', 'aurora', 'mesh', 'lava', 'clouds'];
  const paintCache = {};
  const rgbOf = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  function valueNoise(seed) {
    const r = rng(seed), P = new Float32Array(65536);
    for (let i = 0; i < P.length; i++) P[i] = r();
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const i0 = (yi & 255) << 8, i1 = ((yi + 1) & 255) << 8, x0 = xi & 255, x1 = (xi + 1) & 255;
      const a = P[i0 + x0], b = P[i0 + x1], c = P[i1 + x0], d = P[i1 + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function paint(pl) {
    const cols = pl.colors;
    if (cols.length === 1) return cols[0];
    const key = cols.join() + '|' + pl.seed;
    if (paintCache[key]) return paintCache[key];

    const r = rng(pl.seed);
    const order = cols.slice().sort(() => r() - .5).map(rgbOf);
    const n = order.length;
    const noise = valueNoise(pl.seed);
    const fbm = (x, y) => .5 * noise(x, y) + .25 * noise(x * 2.03, y * 2.03) + .125 * noise(x * 4.01, y * 4.01);
    const pick = a => a[Math.floor(r() * a.length)];

    const style = pick(STYLES);
    const ang = r() * Math.PI, ca = Math.cos(ang), sa = Math.sin(ang);
    const freq = 1.2 + r() * 1.4;
    const ox = r() * 100, oy = r() * 100;

    // per-style knobs
    const banded = style === 'marble' || style === 'silk' || style === 'split' || style === 'aurora';
    const B = {
      marble: { bands: 1.6 + r() * 1.1, warp: 1.8 + r() * 1, soft: .25, vein: .2, sheen: .1 },
      silk:   { bands: 1 + r() * .6,    warp: 1 + r() * .8,  soft: .6,  vein: 0,  sheen: .16 },
      split:  { bands: 1,               warp: .12 + r() * .1, soft: .14, vein: .14, sheen: 0 },
      aurora: { bands: .9 + r() * .4,   warp: .9 + r() * .5, soft: .65, vein: 0, sheen: .2 },
    }[style];
    // mesh / lava / clouds: soft color fields around scattered points
    const pts = [];
    if (!banded) {
      const per = style === 'lava' ? 3 : 2;
      for (let k = 0; k < n * per; k++) pts.push({ x: .05 + r() * .9, y: .05 + r() * .9, c: order[k % n] });
    }
    const power = style === 'lava' ? 5 : style === 'clouds' ? 1.4 : 2.2;
    const jitter = style === 'clouds' ? .55 : style === 'lava' ? .18 : .25;

    const N = 360;
    const cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(N, N), px = img.data;
    const out = [0, 0, 0];

    for (let y = 0; y < N; y++) {
      const v = y / N;
      for (let x = 0; x < N; x++) {
        const u = x / N;
        // domain-warped noise for organic bending
        const qx = fbm(u * freq + ox, v * freq + oy), qy = fbm(u * freq + ox + 5.2, v * freq + oy + 1.3);
        let shade = 1, vein = 0;
        if (banded) {
          // aurora: noise stretched along the band direction gives long streaky curtains
          const w = style === 'aurora'
            ? fbm((-u * sa + v * ca) * 7 + qx + ox, (u * ca + v * sa) * .8 + oy) - .45
            : fbm(u * freq + qx * 2.2 + ox, v * freq + qy * 2.2 + oy) - .45;
          // split/silk keep each color in one wide region; the others repeat
          const proj = (u - .5) * ca + (v - .5) * sa;
          const t = style === 'split'
            ? Math.min(n - .001, Math.max(0, (proj / 1.1 + .5) * n + w * B.warp * 2.5)) // each color once, evenly
            : (proj + .7) * B.bands * n + w * B.warp * 2.5;
          const ti = Math.floor(t), f = t - ti;
          const c0 = order[((ti % n) + n) % n], c1 = order[(((ti + 1) % n) + n) % n];
          let s = f > 1 - B.soft && !(style === 'split' && ti >= n - 1) ? (f - (1 - B.soft)) / B.soft : 0;
          s = s * s * (3 - 2 * s);
          for (let ch = 0; ch < 3; ch++) out[ch] = c0[ch] + (c1[ch] - c0[ch]) * s;
          shade = 1 + B.sheen * (Math.sin(Math.PI * f) - .55);
          vein = B.vein * Math.exp(-(f * f) / .0008);
        } else {
          const su = u + (qx - .45) * jitter, sv = v + (qy - .45) * jitter;
          let tw = 0; out[0] = out[1] = out[2] = 0;
          for (const p of pts) {
            const dx = su - p.x, dy = sv - p.y;
            const wt = 1 / Math.pow(dx * dx + dy * dy + .002, power);
            tw += wt;
            out[0] += p.c[0] * wt; out[1] += p.c[1] * wt; out[2] += p.c[2] * wt;
          }
          out[0] /= tw; out[1] /= tw; out[2] /= tw;
          if (style === 'clouds') shade = .94 + .12 * fbm(u * 6 + ox, v * 6 + oy);
        }
        const vig = 1 - .18 * Math.max(0, Math.hypot(u - .5, v - .5) - .3);
        const k = (y * N + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          let c = out[ch] * shade * vig;
          px[k + ch] = c + (255 - c) * vein;
        }
        px[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const base = cols[0];
    try { return (paintCache[key] = `url("${cv.toDataURL('image/jpeg', .9)}") center / cover, ${base}`); }
    catch { return (paintCache[key] = base); }
  }
  // A single color to represent a player on dark UI (badges, commander-damage readout).
  const accent = pl => { const c = pl.colors.find(c => c !== BLACK) || BLACK; return BRIGHT[c] || c; };

  // Panel rectangles as fractions of the board, plus the rotation that makes
  // each panel face its player. 90 = player sits on the left side of the phone,
  // -90 = right side, 180 = top end, 0 = bottom end.
  // Players are listed clockwise around the table.
  const LAYOUTS = {
    2: [
      { x: 0,  y: 0,  w: 1,  h: .5, r: 180 },
      { x: 0,  y: .5, w: 1,  h: .5, r: 0 },
    ],
    3: [
      { x: 0,  y: 0,  w: 1,  h: .5, r: 180 },
      { x: .5, y: .5, w: .5, h: .5, r: -90 },
      { x: 0,  y: .5, w: .5, h: .5, r: 90 },
    ],
    4: [
      { x: 0,  y: 0,  w: .5, h: .5, r: 90 },
      { x: .5, y: 0,  w: .5, h: .5, r: -90 },
      { x: .5, y: .5, w: .5, h: .5, r: -90 },
      { x: 0,  y: .5, w: .5, h: .5, r: 90 },
    ],
  };

  const KEY = 'mtg-life-v1';
  const defaults = () => ({
    settings: { count: 4, startLife: 40, cmdOn: true, cmdLimit: 21, poisonOn: true, poisonLimit: 10 },
    players: [0, 1, 2, 3].map(i => ({ name: 'Player ' + (i + 1), colors: [DEFAULT_COLORS[i]], seed: newSeed() })),
    game: null,
  });

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch { S = defaults(); }
  S = Object.assign(defaults(), S);
  S.settings = Object.assign(defaults().settings, S.settings);
  // migrate older saves that stored a single `color`
  S.players.forEach((pl, i) => {
    if (!Array.isArray(pl.colors) || !pl.colors.length) pl.colors = [pl.color || DEFAULT_COLORS[i]];
    delete pl.color;
    pl.colors = [...new Set(pl.colors.map(c => OLD[c] || c))];
    if (typeof pl.seed !== 'number') pl.seed = newSeed();
  });

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  function newGame() {
    const n = S.settings.count;
    S.game = {
      n,
      life: Array(n).fill(S.settings.startLife),
      poison: Array(n).fill(0),
      cmd: Array.from({ length: n }, () => Array(n).fill(0)), // cmd[victim][source]
    };
    modes = Array(n).fill(null).map(() => ({ type: 'life' }));
    save();
  }
  const isDirty = () => {
    const g = S.game;
    return g.life.some(l => l !== S.settings.startLife) || g.poison.some(p => p > 0) || g.cmd.some(r => r.some(c => c > 0));
  };

  let modes = [];
  if (!S.game || S.game.n !== S.settings.count) newGame();
  modes = Array(S.game.n).fill(null).map(() => ({ type: 'life' }));

  const board = document.getElementById('board');
  const badgesEl = document.getElementById('badges');
  const menuBtn = document.getElementById('menuBtn');
  let panels = [], badges = {};
  const modeTimers = [], deltas = [];

  // ---------- building ----------
  function build() {
    panels.forEach(p => p.el.remove());
    badgesEl.innerHTML = '';
    panels = []; badges = {};
    const n = S.game.n;

    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'panel';
      el.innerHTML = `
        <div class="inner">
          <div class="shade"></div>
          <div class="zone minus"></div><div class="zone plus"></div>
          <div class="glyph minus">−</div><div class="glyph plus">+</div>
          <div class="center"><div class="label"></div><div class="num"></div><div class="sub"></div></div>
          <div class="delta"></div>
          <div class="foot"><span class="who"><span class="pips"></span><span class="name"></span></span><button class="poison"></button></div>
        </div>`;
      board.insertBefore(el, badgesEl);
      const q = s => el.querySelector(s);
      const p = {
        el, inner: q('.inner'), label: q('.label'), num: q('.num'), sub: q('.sub'),
        delta: q('.delta'), name: q('.name'), poison: q('.poison'), pips: q('.pips'),
      };
      bindZone(q('.zone.minus'), i, -1);
      bindZone(q('.zone.plus'), i, +1);
      p.poison.addEventListener('click', e => { e.stopPropagation(); toggleMode(i, { type: 'poison' }); });
      panels.push(p);

      for (let j = 0; j < n; j++) {
        if (j === i) continue;
        const b = document.createElement('button');
        b.className = 'badge';
        b.addEventListener('click', e => { e.stopPropagation(); toggleMode(i, { type: 'cmd', src: j }); });
        badgesEl.appendChild(b);
        badges[i + '-' + j] = b;
      }
    }
    layout();
    render();
  }

  // ---------- layout ----------
  // Where on panel i's border should opponent j's commander-damage badge go?
  // Shared edge -> middle of the shared stretch of that edge.
  // Touching only at a corner (diagonal) -> that corner.
  function badgePos(R, O, W, H) {
    const E = 1, EDGE = 25, CORNER = 34;
    const r = { l: R.x * W, t: R.y * H, r: (R.x + R.w) * W, b: (R.y + R.h) * H };
    const o = { l: O.x * W, t: O.y * H, r: (O.x + O.w) * W, b: (O.y + O.h) * H };
    const yOver = [Math.max(r.t, o.t), Math.min(r.b, o.b)];
    const xOver = [Math.max(r.l, o.l), Math.min(r.r, o.r)];
    if (yOver[1] - yOver[0] > E) {
      if (Math.abs(r.r - o.l) < E) return { x: r.r - EDGE, y: (yOver[0] + yOver[1]) / 2, ax: 'y' };
      if (Math.abs(r.l - o.r) < E) return { x: r.l + EDGE, y: (yOver[0] + yOver[1]) / 2, ax: 'y' };
    }
    if (xOver[1] - xOver[0] > E) {
      if (Math.abs(r.b - o.t) < E) return { x: (xOver[0] + xOver[1]) / 2, y: r.b - EDGE, ax: 'x' };
      if (Math.abs(r.t - o.b) < E) return { x: (xOver[0] + xOver[1]) / 2, y: r.t + EDGE, ax: 'x' };
    }
    // diagonal / not touching: nearest corner of R toward O
    const ocx = (o.l + o.r) / 2, ocy = (o.t + o.b) / 2;
    const right = ocx > (r.l + r.r) / 2, down = ocy > (r.t + r.b) / 2;
    return { x: right ? r.r - CORNER : r.l + CORNER, y: down ? r.b - CORNER : r.t + CORNER, ax: null };
  }

  function layout() {
    const W = board.clientWidth, H = board.clientHeight, g = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 5;
    const L = LAYOUTS[S.game.n];
    const mx = W / 2, my = H / 2;
    menuBtn.style.left = mx + 'px'; menuBtn.style.top = my + 'px';

    L.forEach((c, i) => {
      const p = panels[i];
      const pw = c.w * W - g, ph = c.h * H - g;
      Object.assign(p.el.style, {
        left: c.x * W + g / 2 + 'px', top: c.y * H + g / 2 + 'px', width: pw + 'px', height: ph + 'px',
      });
      const side = Math.abs(c.r) === 90;
      const iw = side ? ph : pw, ih = side ? pw : ph;
      Object.assign(p.inner.style, {
        width: iw + 'px', height: ih + 'px',
        transform: `translate(-50%,-50%) rotate(${c.r}deg)`,
      });
      p.el.style.setProperty('--big', Math.min(ih * .46, iw * .32) + 'px');

      L.forEach((o, j) => {
        if (j === i) return;
        const pos = badgePos(c, o, W, H);
        // keep badges clear of the centre settings button (matters for 2 players)
        if (Math.hypot(pos.x - mx, pos.y - my) < 52) {
          const rad = c.r * Math.PI / 180;
          const readerRight = { x: Math.cos(rad), y: Math.sin(rad) };
          if (pos.ax === 'x') pos.x += 64 * (Math.sign(readerRight.x) || 1);
          else if (pos.ax === 'y') pos.y += 64 * (Math.sign(readerRight.y) || 1);
        }
        const b = badges[i + '-' + j];
        b.style.left = pos.x + 'px'; b.style.top = pos.y + 'px';
        b.style.transform = `rotate(${c.r}deg)`;
      });
    });
  }

  // ---------- rendering ----------
  const lethalCmd = (i) => S.settings.cmdOn && S.game.cmd[i].some(c => c >= S.settings.cmdLimit);
  const isDead = (i) => S.game.life[i] <= 0 || (S.settings.poisonOn && S.game.poison[i] >= S.settings.poisonLimit) || lethalCmd(i);

  function render() {
    const g = S.game, st = S.settings;
    panels.forEach((p, i) => {
      const pl = S.players[i], m = modes[i];
      const bg = paint(pl);
      if (p.bg !== bg) { p.el.style.background = bg; p.bg = bg; }
      p.el.classList.toggle('dark', pl.colors.length === 1 && isDarkSet(pl.colors));
      p.el.classList.toggle('multi', pl.colors.length > 1);
      p.name.textContent = (isDead(i) ? '☠ ' : '') + pl.name;
      const pipKey = pl.colors.join();
      if (p.pipKey !== pipKey) {
        p.pipKey = pipKey;
        p.pips.innerHTML = pl.colors.filter(c => GLYPHS[c]).map(c => `<span class="pip" style="background:${c}">${glyph(c)}</span>`).join('');
      }
      p.el.classList.toggle('dead', isDead(i));
      p.el.classList.toggle('alt', m.type !== 'life');

      p.poison.classList.toggle('hidden', !st.poisonOn);
      p.poison.classList.toggle('active', m.type === 'poison');
      p.poison.textContent = '☣ ' + g.poison[i];

      if (m.type === 'cmd') {
        const src = S.players[m.src];
        p.label.textContent = '⚔ from ' + src.name;
        p.label.style.color = accent(src);
        p.num.textContent = g.cmd[i][m.src];
        p.num.style.color = accent(src);
        p.sub.textContent = '♥ ' + g.life[i];
      } else if (m.type === 'poison') {
        p.label.textContent = '☣ Poison';
        p.label.style.color = '#7fe07f';
        p.num.textContent = g.poison[i];
        p.num.style.color = '#7fe07f';
        p.sub.textContent = 'lethal at ' + st.poisonLimit;
      } else {
        p.label.textContent = '';
        p.num.textContent = g.life[i];
        p.num.style.color = '';
        p.sub.textContent = '';
      }

      for (let j = 0; j < g.n; j++) {
        if (j === i) continue;
        const b = badges[i + '-' + j];
        b.classList.toggle('hidden', !st.cmdOn);
        b.textContent = g.cmd[i][j];
        b.style.color = accent(S.players[j]);
        b.classList.toggle('active', m.type === 'cmd' && m.src === j);
        b.classList.toggle('lethal', g.cmd[i][j] >= st.cmdLimit);
      }
    });
    checkWin();
  }

  // ---------- win screen ----------
  // Shown once when exactly one player is left standing. "Keep playing" hides it
  // (remembered in the save); it comes back if someone revives and dies again.
  const winEl = document.getElementById('win');
  function checkWin() {
    const g = S.game;
    const alive = [...Array(g.n).keys()].filter(i => !isDead(i));
    if (alive.length !== 1) {
      if (g.winSeen != null) { g.winSeen = null; save(); }
      if (winEl.classList.contains('open')) winEl.classList.remove('open');
      return;
    }
    const w = alive[0];
    if (g.winSeen === w || winEl.classList.contains('open')) return;
    showWin(w);
  }
  function showWin(w) {
    const pl = S.players[w], g = S.game;
    winEl.style.background = paint(pl);
    document.getElementById('winName').textContent = pl.name;
    document.getElementById('winPips').innerHTML =
      pl.colors.filter(c => GLYPHS[c]).map(c => `<span class="pip" style="background:${c}">${glyph(c)}</span>`).join('');
    const life = g.life[w];
    const extra = S.settings.poisonOn && g.poison[w] ? ` · ☣ ${g.poison[w]}` : '';
    document.getElementById('winStats').textContent = `♥ ${life} life left${extra}`;
    // face the winner
    const rot = LAYOUTS[g.n][w].r;
    winEl.querySelector('.win-card').style.rotate = rot + 'deg';
    // floating symbols in the winner's colors (all five if they only use extra colors)
    const syms = pl.colors.filter(c => GLYPHS[c]);
    const pool = syms.length ? syms : [WHITE, BLUE, BLACK, RED, GREEN];
    let html = '';
    for (let k = 0; k < 26; k++) {
      const c = pool[k % pool.length], size = 22 + Math.random() * 26;
      html += `<span class="float" style="left:${(Math.random() * 100).toFixed(1)}%;width:${size}px;height:${size}px;` +
        `background:${c};animation-duration:${(5 + Math.random() * 6).toFixed(1)}s;animation-delay:${(-Math.random() * 10).toFixed(1)}s;` +
        `--spin:${Math.round((Math.random() - .5) * 540)}deg">${glyph(c)}</span>`;
    }
    document.getElementById('winFloats').innerHTML = html;
    closeSheet();
    winEl.classList.add('open');
  }
  function hideWin() {
    S.game.winSeen = S.game.life.findIndex((_, i) => !isDead(i));
    save();
    winEl.classList.remove('open');
  }

  // ---------- interaction ----------
  function setMode(i, m) {
    modes[i] = m;
    clearTimeout(modeTimers[i]);
    if (m.type !== 'life') modeTimers[i] = setTimeout(() => { modes[i] = { type: 'life' }; render(); }, 7000);
    showDelta(i, 0, true);
    render();
  }
  function toggleMode(i, m) {
    const cur = modes[i];
    const same = cur.type === m.type && cur.src === m.src;
    setMode(i, same ? { type: 'life' } : m);
  }

  function apply(i, d) {
    const g = S.game, m = modes[i];
    let shown = 0;
    if (m.type === 'cmd') {
      const before = g.cmd[i][m.src];
      const after = Math.max(0, before + d);
      const actual = after - before;
      g.cmd[i][m.src] = after;
      g.life[i] -= actual;               // commander damage is also life loss
      shown = actual;
    } else if (m.type === 'poison') {
      const before = g.poison[i];
      g.poison[i] = Math.max(0, before + d);
      shown = g.poison[i] - before;
    } else {
      g.life[i] += d;
      shown = d;
    }
    if (m.type !== 'life') setModeTimer(i);
    showDelta(i, shown);
    save();
    render();
  }
  function setModeTimer(i) {
    clearTimeout(modeTimers[i]);
    modeTimers[i] = setTimeout(() => { modes[i] = { type: 'life' }; render(); }, 7000);
  }

  function showDelta(i, d, reset) {
    const p = panels[i];
    const st = deltas[i] || (deltas[i] = { v: 0, t: 0 });
    clearTimeout(st.t);
    if (reset) { st.v = 0; p.delta.classList.remove('show'); return; }
    st.v += d;
    p.delta.textContent = st.v > 0 ? '+' + st.v : st.v === 0 ? '±0' : '−' + Math.abs(st.v);
    p.delta.classList.add('show');
    st.t = setTimeout(() => { st.v = 0; p.delta.classList.remove('show'); }, 1800);
  }

  // tap = ±1, hold = ±10 repeating
  function bindZone(z, i, sign) {
    let hold = null, rep = null, held = false;
    const stop = () => { clearTimeout(hold); clearInterval(rep); z.classList.remove('pressed'); };
    z.addEventListener('pointerdown', e => {
      e.preventDefault();
      keepAwake();
      try { z.setPointerCapture(e.pointerId); } catch {}
      held = false; z.classList.add('pressed');
      hold = setTimeout(() => {
        held = true; apply(i, sign * 10);
        rep = setInterval(() => apply(i, sign * 10), 550);
      }, 450);
    });
    z.addEventListener('pointerup', () => { stop(); if (!held) apply(i, sign); });
    z.addEventListener('pointercancel', stop);
  }

  // ---------- who goes first ----------
  function pickFirst() {
    closeSheet();
    const n = S.game.n, target = Math.floor(Math.random() * n);
    const steps = n * 3 + target;
    panels.forEach(p => p.el.classList.remove('chosen'));
    let k = 0;
    const tick = () => {
      const idx = k % n;
      panels.forEach((p, j) => p.el.classList.toggle('chosen', j === idx));
      if (k >= steps) { setTimeout(() => panels[idx].el.classList.remove('chosen'), 2500); return; }
      k++;
      setTimeout(tick, 60 + k * 12);
    };
    tick();
  }

  // ---------- settings sheet ----------
  const sheet = document.getElementById('sheet');
  const $ = id => document.getElementById(id);

  function openSheet() { fillSheet(); sheet.classList.add('open'); }
  function closeSheet() { sheet.classList.remove('open'); }

  function fillSheet() {
    const st = S.settings;
    $('countSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === st.count));
    $('lifeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.l === st.startLife));
    $('lifeInput').value = st.startLife;
    $('cmdOn').checked = st.cmdOn; $('cmdLimit').value = st.cmdLimit;
    $('poisonOn').checked = st.poisonOn; $('poisonLimit').value = st.poisonLimit;
    const pe = $('playerEdit');
    pe.innerHTML = '';
    for (let i = 0; i < st.count; i++) {
      const pl = S.players[i];
      const wrap = document.createElement('div');
      wrap.className = 'pl';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = pl.name; inp.maxLength = 16;
      inp.addEventListener('input', () => { pl.name = inp.value || 'Player ' + (i + 1); save(); render(); });
      const sw = document.createElement('div');
      sw.className = 'swatches';
      COLORS.forEach(c => {
        const b = document.createElement('button');
        const on = pl.colors.includes(c);
        b.className = 'sw' + (on ? ' on' : '') + (lum(c) < .25 ? ' darksw' : '') + (GLYPHS[c] ? ' sym' : '');
        b.style.background = c;
        b.innerHTML = glyph(c);
        b.setAttribute('aria-pressed', on);
        b.addEventListener('click', () => {
          if (on) { if (pl.colors.length > 1) pl.colors = pl.colors.filter(x => x !== c); }
          else pl.colors = [...pl.colors, c];
          pl.seed = newSeed();
          save(); render(); fillSheet();
        });
        sw.appendChild(b);
      });
      // live preview of the panel background, with a re-roll for blends
      const pv = document.createElement('div');
      pv.className = 'preview';
      pv.dataset.i = i;
      pv.style.background = paint(pl);
      const rr = document.createElement('button');
      rr.className = 'reroll' + (pl.colors.length > 1 ? '' : ' hidden');
      rr.textContent = '🔀 New swirl';
      rr.addEventListener('click', () => { pl.seed = newSeed(); save(); render(); fillSheet(); });
      pv.appendChild(rr);
      wrap.append(inp, sw, pv);
      pe.appendChild(wrap);
    }
  }

  function setStartLife(v) {
    v = Math.max(1, Math.min(999, Math.round(v) || 40));
    const wasClean = !isDirty();
    S.settings.startLife = v;
    if (wasClean) { newGame(); render(); $('lifeHint').textContent = ''; }
    else $('lifeHint').textContent = 'Takes effect when you reset the game.';
    save(); fillSheet();
  }

  $('countSeg').addEventListener('click', e => {
    const n = +e.target.dataset.n;
    if (!n || n === S.settings.count) return;
    if (isDirty() && !confirm('Changing the player count resets the game. Continue?')) return;
    S.settings.count = n;
    newGame(); build(); fillSheet();
  });
  $('lifeSeg').addEventListener('click', e => { if (e.target.dataset.l) setStartLife(+e.target.dataset.l); });
  $('lifeInput').addEventListener('change', e => setStartLife(+e.target.value));
  $('cmdOn').addEventListener('change', e => { S.settings.cmdOn = e.target.checked; save(); render(); });
  $('poisonOn').addEventListener('change', e => {
    S.settings.poisonOn = e.target.checked;
    if (!e.target.checked) modes = modes.map(m => m.type === 'poison' ? { type: 'life' } : m);
    save(); render();
  });
  $('cmdLimit').addEventListener('change', e => { S.settings.cmdLimit = Math.max(1, +e.target.value || 21); save(); render(); fillSheet(); });
  $('poisonLimit').addEventListener('change', e => { S.settings.poisonLimit = Math.max(1, +e.target.value || 10); save(); render(); fillSheet(); });
  $('resetBtn').addEventListener('click', () => {
    if (!confirm('Reset all life totals and counters?')) return;
    newGame(); $('lifeHint').textContent = ''; render(); closeSheet();
  });
  $('firstBtn').addEventListener('click', pickFirst);
  $('winBack').addEventListener('click', hideWin);
  $('winNew').addEventListener('click', () => { winEl.classList.remove('open'); newGame(); render(); });
  $('closeBtn').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  menuBtn.addEventListener('click', openSheet);

  // ---------- platform bits ----------
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('gesturestart', e => e.preventDefault()); // block pinch-zoom on iOS
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 300));

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  build();
})();
</script>
</body>
</html>
